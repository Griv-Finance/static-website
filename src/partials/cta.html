<section class="sec cta" aria-label="Get started">
  <div class="cta-panel reveal">
    <div class="cta-art" aria-hidden="true">
      <div class="rib r1"><div class="rib-ln"><svg viewBox="-900 -650 1800 1300"><g class="ln"><use href="#gp" transform="scale(1.08)"/><use href="#gp" transform="scale(1.18)"/><use href="#gp" transform="scale(1.3)"/><use href="#gp" transform="scale(1.44)"/><use href="#gp" transform="scale(1.6)"/><use href="#gp" transform="scale(1.78)"/><use href="#gp" transform="scale(1.98)"/><use href="#gp" transform="scale(2.2)"/></g></svg></div><div class="rib-lt"><svg viewBox="-900 -650 1800 1300"><use class="lt" href="#gp" fill="url(#ribLight)" filter="url(#ribBlur)"/><use class="dk" href="#gp" transform="translate(-34 26) scale(.95)" filter="url(#ribSoft)"/></svg></div></div>
      <div class="rib r2"><div class="rib-ln"><svg viewBox="-900 -650 1800 1300"><g class="ln"><use href="#gp" transform="scale(1.08)"/><use href="#gp" transform="scale(1.18)"/><use href="#gp" transform="scale(1.3)"/><use href="#gp" transform="scale(1.44)"/><use href="#gp" transform="scale(1.6)"/><use href="#gp" transform="scale(1.78)"/><use href="#gp" transform="scale(1.98)"/><use href="#gp" transform="scale(2.2)"/></g></svg></div><div class="rib-lt"><svg viewBox="-900 -650 1800 1300"><use class="lt" href="#gp" fill="url(#ribLight2)" filter="url(#ribBlur)"/><use class="dk" href="#gp" transform="translate(-34 26) scale(.95)" filter="url(#ribSoft)"/></svg></div></div>
      <span class="beam"></span>
    </div>
    <div class="cta-in">
      <h2 class="h-cta">{{title}}</h2>
      <p class="cta-v">{{sub}}</p>
      <div class="cta-btns">
        <a href="{{href}}" class="btn btn-lg">{{button}} <svg class="ic"><use href="#i-chev"/></svg></a>
        <a href="/contact/?topic=sales" class="btn btn-lg btn-ghost">Talk to us</a>
      </div>
    </div>
  </div>
</section>
